<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ClubFinder: find your school's clubs by name, keyword, type, or meeting day.">
<title>ClubFinder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--ink:#17223b;--mute:#5d6578;--card:#fff;--line:#dcd8cc;--accent:#ffb703;--accent-ink:#17223b;
--academic:#2a6fdb;--community:#e0457b;--hobbies:#14a37f;--competition:#e8590c;--student:#7b4fd6;--team:#0b8fa8;--athletics:#b08900}
@media(prefers-color-scheme:dark){:root{--bg:#10151f;--ink:#eef0f6;--mute:#9aa3b8;--card:#1a2130;--line:#2b3447}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{background:var(--ink);color:#fff;padding:56px 0 84px}
@media(prefers-color-scheme:dark){header{background:#0a0e16}}
h1{font-size:clamp(2.6rem,8vw,5rem);line-height:1;margin:0 0 12px;font-weight:800;letter-spacing:-.03em}
header p{margin:0;font-size:1.2rem;max-width:34ch;color:#cfd5e6}
.search{margin-top:-30px}
.sbox{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:6px 16px;box-shadow:6px 6px 0 var(--accent)}
.sbox:focus-within{outline:3px solid var(--accent);outline-offset:3px}
.sbox input{flex:1;border:0;background:none;font:inherit;font-size:1.15rem;color:var(--ink);padding:12px 0;min-width:0}
.sbox input:focus{outline:none}
.sbox button{border:0;background:none;color:var(--mute);font:inherit;cursor:pointer;padding:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px 20px;margin:22px 0 8px;align-items:center}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group b{font-size:.9rem;color:var(--mute);font-weight:600;margin-right:2px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;padding:5px 13px;border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{background:var(--accent);color:#17223b;border-color:var(--accent)}}
.chip:focus-visible,.card a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.count{margin:14px 0;color:var(--mute);font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-bottom:60px}
.card{background:var(--card);border:1.5px solid var(--line);border-left:8px solid var(--c);border-radius:6px 14px 14px 6px;padding:18px 18px 16px}
.card h2{font-size:1.2rem;line-height:1.2;margin:0 0 8px;font-weight:800}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:.8rem;padding:2px 10px;border-radius:99px;border:1.5px solid var(--c);color:var(--c);font-weight:600}
.tag.asb{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag.soc{border-color:var(--mute);color:var(--mute)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.93rem}
dt{color:var(--mute)}dd{margin:0;overflow-wrap:anywhere}
.card a{color:inherit;text-decoration-color:var(--c);text-underline-offset:3px}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--mute)}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mute);font-size:.9rem}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-3px)}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>ClubFinder</h1>
<p>Find your hobby, your community, your next obsession.</p>
</div></header>

<main class="wrap">
<div class="search"><label class="sbox"><span aria-hidden="true">🔍</span>
<input id="q" type="search" placeholder="Search by name or keyword: coding, music, debate, Tuesday..." aria-label="Search clubs" autocomplete="off">
<button id="clear" type="button" hidden aria-label="Clear search">✕</button></label></div>

<div class="filters" id="filters"></div>
<div class="count" id="count" aria-live="polite"></div>
<div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">Club info is from the 2026-2027 club master list. Meeting rooms and days can change, so check with the club contact.</div></footer>

const COLORS={Academic:"--academic",Community:"--community",Hobbies:"--hobbies",Competition:"--competition","Student Union":"--student",Team:"--team",Athletics:"--athletics"};
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const dayOf=c=>DAYS.filter(d=>new RegExp(d,"i").test(c.when)||(d=="Mon"&&/Mon-Wed/.test(c.when))||(d=="Tue"&&/Mon-Wed/.test(c.when))||(d=="Wed"&&/Mon-Wed/.test(c.when))||(d=="Tue"&&/Every day/.test(c.when)));
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
DATA.forEach(c=>{c.days=dayOf(c);if(/Every day except Friday/.test(c.when))c.days=["Mon","Tue","Wed","Thu","Sat","Sun"].slice(0,4);c.hay=[c.name,c.type,c.grp,c.who,c.room,c.when,c.sponsor,c.kw,c.days.join(" ")].join(" ").toLowerCase()});

const S={q:"",type:"All",grp:"All",day:"All"};
const $=id=>document.getElementById(id);
const types=["All",...Object.keys(COLORS)];
function chips(label,key,opts){return `<div class="group"><b>${label}</b>${opts.map(o=>`<button class="chip" type="button" data-k="${key}" data-v="${o}" aria-pressed="${S[key]===o}">${o}</button>`).join("")}</div>`}
function drawFilters(){$("filters").innerHTML=chips("Type","type",types)+chips("Group","grp",["All","ASB","Social"])+chips("Day","day",["All",...DAYS])}
function card(c){const col=`var(${COLORS[c.type]||"--mute"})`;
const mails=c.mail?c.mail.split(/[ ,]+/).filter(Boolean).map(m=>`<a href="mailto:${esc(m)}">${esc(m)}</a>`).join("<br>"):"TBD";
return `<article class="card" style="--c:${col}"><h2>${esc(c.name)}</h2>
<div class="tags"><span class="tag">${esc(c.type)}</span><span class="tag ${c.grp=="ASB"?"asb":"soc"}">${esc(c.grp)}</span></div>
<dl><dt>When</dt><dd>${esc(c.when)}</dd><dt>Where</dt><dd>${esc(c.room)}</dd><dt>Officers</dt><dd>${esc(c.who)}</dd><dt>Sponsor</dt><dd>${esc(c.sponsor||"TBD")}</dd><dt>Contact</dt><dd>${mails}</dd></dl></article>`}
function render(){
const words=S.q.toLowerCase().split(/\s+/).filter(Boolean);
const out=DATA.filter(c=>(S.type=="All"||c.type==S.type)&&(S.grp=="All"||c.grp==S.grp)&&(S.day=="All"||c.days.includes(S.day))&&words.every(w=>c.hay.includes(w)));
$("count").textContent=`${out.length} of ${DATA.length} clubs`;
$("grid").innerHTML=out.length?out.map(card).join(""):`<div class="empty"><p><b>No clubs match that search.</b></p><p>Try a shorter keyword or clear a filter.</p></div>`;
$("clear").hidden=!S.q}
$("q").addEventListener("input",e=>{S.q=e.target.value;render()});
$("clear").addEventListener("click",()=>{S.q="";$("q").value="";$("q").focus();render()});
$("filters").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;S[b.dataset.k]=b.dataset.v;drawFilters();render()});
drawFilters();render();
</script>
